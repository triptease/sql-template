# NOTE: npm Trusted Publishing is bound to this exact filename (build.yml). Do not rename it.
name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run clean
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test

  publish:
    needs: test
    if: github.event_name == 'push' && github.repository == 'triptease/sql-template'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC) and provenance
      packages: write   # GitHub Packages (npm.pkg.github.com)
    env:
      # Repo variable: set to "true" once npm Trusted Publishing is configured (see README "Releasing").
      NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the version uses git rev-list --count HEAD
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun scripts/release.ts   # clean build, stamp dist/package.json, publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional fallback when Trusted Publishing is not configured; empty if the secret does not exist.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: dist
          # the staged packages exactly as published (package.json with the stamped version, README, .js/.d.ts)
          path: '*/dist/'
          if-no-files-found: warn
